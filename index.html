<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>바카라 기록판</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #141414;
      --muted: #747474;
      --line: #d7d7d7;
      --panel: #f7f7f7;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
      --blue: #4d85ea;
      --red: #df4a42;
      --green: #27a05d;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    body { min-height: 100vh; }

    .app {
      width: min(980px, calc(100% - 16px));
      margin: 0 auto;
      padding: 12px 0 calc(170px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .title-wrap h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
      letter-spacing: -0.04em;
    }
    .title-wrap p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .ghost-btn {
      appearance: none;
      border: 1px solid #cfcfcf;
      background: #fff;
      color: #222;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      white-space: nowrap;
    }
    .ghost-btn:active { transform: scale(.98); }
    .ghost-btn.reset { background: #111; color: #fff; border-color: #111; }

    .board-shell {
      position: relative;
      border-radius: 16px;
      background: #fafafa;
      border: 2px solid #9f9f9f;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), var(--shadow);
      overflow: hidden;
    }

    .board-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      background: #f4f4f4;
    }

    .board {
      display: grid;
      grid-template-rows: repeat(6, 44px);
      grid-auto-flow: column;
      grid-auto-columns: 44px;
      min-width: 100%;
      background-image:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 44px 44px;
      background-position: 0 0;
      padding-right: 44px;
      min-height: 264px;
    }

    .board-empty {
      min-width: 100%;
      min-height: 264px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 20px;
      background-image:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 44px 44px;
      background-position: 0 0;
    }

    .cell {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chip {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,.85);
      border: 5px solid;
      box-shadow: 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(255,255,255,.4);
      position: relative;
    }
    .chip.P { border-color: var(--blue); }
    .chip.B { border-color: var(--red); }
    .chip.T { border-color: var(--green); }

    .chip.tie-mark::before,
    .chip.tie-double::before,
    .chip.tie-double::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 38px;
      background: var(--green);
      border-radius: 99px;
      pointer-events: none;
      z-index: 1;
    }
    .chip.tie-mark::before,
    .chip.tie-double::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .chip.tie-double::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }
    .tie-badge {
      position: absolute;
      right: -2px;
      top: -4px;
      min-width: 16px;
      height: 16px;
      padding: 0 3px;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      display: grid;
      place-items: center;
      line-height: 1;
      box-shadow: 0 1px 3px rgba(0,0,0,.18);
    }

    .floating-top {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.94);
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      z-index: 3;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .floating-top:active { transform: scale(.98); }
    .chevrons {
      position: relative;
      width: 26px;
      height: 26px;
    }
    .chevrons::before,
    .chevrons::after {
      content: "";
      position: absolute;
      left: 3px;
      width: 16px;
      height: 16px;
      border-left: 3px solid #666;
      border-top: 3px solid #666;
      transform: rotate(45deg);
    }
    .chevrons::before { top: 8px; }
    .chevrons::after { top: -2px; }

    .bottom-strip {
      display: grid;
      grid-template-columns: auto auto auto auto;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }
    .round-total {
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 950;
      letter-spacing: -.04em;
      min-width: 74px;
      text-align: center;
    }
    .count-pill {
      height: 42px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #e1e1e1;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
      white-space: nowrap;
    }
    .count-chip {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
    }
    .count-chip.P { background: var(--blue); }
    .count-chip.B { background: var(--red); }
    .count-chip.T { background: var(--green); }
    .count-num {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -.03em;
      min-width: 14px;
    }

    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      background: rgba(255,255,255,.97);
      border-top: 1px solid #d9d9d9;
      box-shadow: 0 -8px 24px rgba(0,0,0,.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px max(10px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-right));
    }
    .dock-inner {
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto auto;
      gap: 10px;
      align-items: center;
    }
    .action-btn {
      height: 54px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      font: inherit;
      font-weight: 900;
      font-size: 22px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 20px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.22), 0 6px 16px rgba(0,0,0,.10);
      letter-spacing: -.03em;
    }
    .action-btn:active { transform: scale(.985); }
    .action-btn.player { background: linear-gradient(180deg, #4f86ef, #245cc7); }
    .action-btn.banker { background: linear-gradient(180deg, #e65f58, #c93b34); }
    .action-btn.tie { background: linear-gradient(180deg, #38b56e, #238b55); }

    .action-mini {
      height: 54px;
      border-radius: 999px;
      padding: 0 18px;
      border: 1px solid #d1d1d1;
      background: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }
    .action-mini.reset { background: #111; color: #fff; border-color: #111; }
    .action-mini:active { transform: scale(.985); }

    .gem {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
    }
    .slash {
      width: 18px;
      height: 4px;
      border-radius: 99px;
      background: currentColor;
      transform: rotate(-45deg);
      margin-left: 2px;
    }

    @media (max-width: 860px) {
      .bottom-strip {
        grid-template-columns: auto auto auto auto;
        row-gap: 10px;
      }
      .bottom-strip .count-pill { min-width: 0; }
      .dock-inner {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .action-mini { height: 46px; }
      .action-mini.undo { grid-column: 1 / 2; }
      .action-mini.reset { grid-column: 2 / 4; }
    }

    @media (max-width: 620px) {
      .app { width: calc(100% - 10px); padding-top: 8px; padding-bottom: calc(196px + env(safe-area-inset-bottom)); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions { width: 100%; justify-content: flex-start; }
      .ghost-btn { padding: 9px 12px; font-size: 14px; }
      .board-shell { border-radius: 14px; }
      .board, .board-empty {
        grid-template-rows: repeat(6, 36px);
        grid-auto-columns: 36px;
        min-height: 216px;
        background-size: 36px 36px;
        padding-right: 36px;
      }
      .cell { width: 36px; height: 36px; }
      .chip { width: 28px; height: 28px; border-width: 4px; }
      .chip.tie-mark::before { width: 4px; height: 31px; }
      .tie-badge { min-width: 14px; height: 14px; font-size: 9px; right: -2px; top: -2px; }
      .floating-top { width: 48px; height: 48px; right: 8px; top: 8px; }
      .chevrons { transform: scale(.85); }
      .bottom-strip {
        grid-template-columns: auto 1fr 1fr 1fr;
        gap: 6px;
      }
      .round-total { font-size: 28px; min-width: 52px; }
      .count-pill { height: 38px; gap: 8px; padding: 0 10px; }
      .count-chip { width: 28px; height: 28px; font-size: 16px; }
      .count-num { font-size: 22px; }
      .dock-inner { gap: 8px; }
      .action-btn { height: 50px; font-size: 18px; padding: 0 10px; }
      .gem { width: 14px; height: 14px; }
      .action-mini { height: 42px; font-size: 14px; padding: 0 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="title-wrap">
        <h1>바카라 기록판</h1>
        <p>표처럼 한눈에 보이게 자동 정렬됩니다.</p>
      </div>
      <div class="top-actions">
        <button id="undoTop" class="ghost-btn" type="button">↩ 마지막 취소</button>
        <button id="resetTop" class="ghost-btn reset" type="button">전체 초기화</button>
      </div>
    </div>

    <section class="board-shell">
      <button id="scrollLeftTop" class="floating-top" type="button" aria-label="처음 위치로 이동">
        <span class="chevrons" aria-hidden="true"></span>
      </button>
      <div id="boardWrap" class="board-scroll">
        <div id="board"></div>
      </div>
    </section>

    <section class="bottom-strip" aria-label="현재 집계">
      <div class="round-total" id="totalRounds">#0</div>
      <div class="count-pill"><span class="count-chip P">P</span><span class="count-num" id="playerCount">0</span></div>
      <div class="count-pill"><span class="count-chip B">B</span><span class="count-num" id="bankerCount">0</span></div>
      <div class="count-pill"><span class="count-chip T">T</span><span class="count-num" id="tieCount">0</span></div>
    </section>
  </main>

  <section class="dock" aria-label="결과 입력">
    <div class="dock-inner">
      <button class="action-btn player" data-result="P" type="button">P</button>
      <button class="action-btn banker" data-result="B" type="button">B</button>
      <button class="action-btn tie" data-result="T" type="button">T</button>
      <button id="undoDock" class="action-mini undo" type="button">↩ 취소</button>
      <button id="resetDock" class="action-mini reset" type="button">전체 초기화</button>
    </div>
  </section>

  <script>
    const history = [];
    const board = document.getElementById('board');
    const boardWrap = document.getElementById('boardWrap');
    const totalRounds = document.getElementById('totalRounds');
    const playerCount = document.getElementById('playerCount');
    const bankerCount = document.getElementById('bankerCount');
    const tieCount = document.getElementById('tieCount');

    const names = { P: 'PLAYER', B: 'BANKER', T: 'TIE' };
    const resetButtons = [document.getElementById('resetTop'), document.getElementById('resetDock')];
    const undoButtons = [document.getElementById('undoTop'), document.getElementById('undoDock')];

    function buildRoad() {
      const cells = [];
      let col = -1;
      let row = 0;
      let lastMain = null;

      history.forEach((result, idx) => {
        if (result === 'T') {
          // TIE는 직전 P/B 칸에 겹쳐 표시. 첫 결과가 TIE면 별도 칸 사용.
          if (cells.length) {
            cells[cells.length - 1].ties += 1;
          } else {
            col = 0;
            row = 0;
            cells.push({ result: 'T', ties: 1, round: idx + 1, row, col, standalone: true });
          }
          return;
        }

        if (lastMain === null) {
          col = 0;
          row = 0;
        } else if (result === lastMain) {
          // 같은 결과가 계속되면 칸 수와 상관없이 같은 열에서 아래로 계속 쌓음
          row += 1;
        } else {
          col += 1;
          row = 0;
        }

        cells.push({ result, ties: 0, round: idx + 1, row, col });
        lastMain = result;
      });

      return cells;
    }

    function renderBoard() {
      const counts = { P: 0, B: 0, T: 0 };
      history.forEach(v => counts[v]++);
      const cells = buildRoad();

      totalRounds.textContent = `#${history.length}`;
      playerCount.textContent = counts.P;
      bankerCount.textContent = counts.B;
      tieCount.textContent = counts.T;

      if (!cells.length) {
        board.className = 'board-empty';
        board.removeAttribute('style');
        board.innerHTML = 'PLAYER · BANKER · TIE 버튼을 눌러 시작하세요.';
        undoButtons.forEach(btn => btn.disabled = true);
        resetButtons.forEach(btn => btn.disabled = true);
        resetButtons.forEach(btn => btn.textContent = '전체 초기화');
        return;
      }

      undoButtons.forEach(btn => btn.disabled = false);
      resetButtons.forEach(btn => btn.disabled = false);

      const cellSize = window.innerWidth <= 620 ? 36 : 44;
      const maxCol = Math.max(...cells.map(c => c.col));
      const maxRow = Math.max(...cells.map(c => c.row));
      const rows = Math.max(6, maxRow + 1);
      const minColumns = window.innerWidth <= 620 ? 10 : 14;
      const columns = Math.max(minColumns, maxCol + 3);

      board.className = 'board';
      board.innerHTML = '';
      board.style.gridTemplateColumns = `repeat(${columns}, ${cellSize}px)`;
      board.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
      board.style.minHeight = `${rows * cellSize}px`;
      board.style.backgroundSize = `${cellSize}px ${cellSize}px`;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.style.gridRow = String(row + 1);
          cell.style.gridColumn = String(col + 1);

          const bead = cells.find(c => c.row === row && c.col === col);
          if (bead) {
            const chip = document.createElement('div');
            chip.className = `chip ${bead.result}`;
            if (bead.result !== 'T') {
              if (bead.ties === 1) chip.classList.add('tie-mark');
              if (bead.ties >= 2) chip.classList.add('tie-double');
            }
            if (bead.ties > 2) {
              const badge = document.createElement('div');
              badge.className = 'tie-badge';
              badge.textContent = bead.ties;
              chip.appendChild(badge);
            }
            chip.title = `${names[bead.result]}${bead.ties ? ` · TIE ${bead.ties}회` : ''}`;
            cell.appendChild(chip);
          }
          board.appendChild(cell);
        }
      }
    }

    function addResult(value) {
      if (!names[value]) return;
      history.push(value);
      renderBoard();
      requestAnimationFrame(() => {
        boardWrap.scrollTo({ left: boardWrap.scrollWidth, behavior: 'smooth' });
      });
    }

    let resetArmed = false;
    let resetTimer = null;

    function armResetVisual(text) {
      resetButtons.forEach(btn => btn.textContent = text);
    }

    function handleReset() {
      if (!history.length) return;
      if (!resetArmed) {
        resetArmed = true;
        armResetVisual('한 번 더 누르면 초기화');
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          resetArmed = false;
          armResetVisual('전체 초기화');
        }, 2500);
        return;
      }
      clearTimeout(resetTimer);
      history.splice(0, history.length);
      resetArmed = false;
      armResetVisual('전체 초기화');
      renderBoard();
      boardWrap.scrollTo({ left: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('[data-result]').forEach(btn => {
      btn.addEventListener('click', () => addResult(btn.dataset.result));
    });

    undoButtons.forEach(btn => btn.addEventListener('click', () => {
      if (!history.length) return;
      history.pop();
      resetArmed = false;
      clearTimeout(resetTimer);
      armResetVisual('전체 초기화');
      renderBoard();
    }));

    resetButtons.forEach(btn => btn.addEventListener('click', handleReset));

    document.getElementById('scrollLeftTop').addEventListener('click', () => {
      boardWrap.scrollTo({ left: 0, behavior: 'smooth' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    window.addEventListener('resize', renderBoard);

    renderBoard();
  </script>
</body>
</html>
