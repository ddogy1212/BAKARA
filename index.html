<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>바카라 라운드 기록판</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #0b1020;
      color: #f8fafc;
      min-height: 100vh;
    }
    .wrap { width: min(1100px, calc(100% - 24px)); margin: 0 auto; padding: 28px 0 40px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 40px); }
    .sub { color: #94a3b8; margin-bottom: 22px; }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    button {
      border: 0; cursor: pointer; border-radius: 18px; min-height: 76px;
      font-size: clamp(16px, 3vw, 22px); font-weight: 800; color: #fff;
      transition: transform .1s ease, opacity .1s ease;
    }
    button:active { transform: scale(.98); }
    .player { background: #2563eb; }
    .banker { background: #dc2626; }
    .tie { background: #16a34a; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0; }
    .stat { background: #131a2d; border: 1px solid #26324d; border-radius: 16px; padding: 14px; text-align: center; }
    .stat small { display: block; color: #94a3b8; margin-bottom: 4px; }
    .stat strong { font-size: 24px; }
    .panel { background: #111827; border: 1px solid #26324d; border-radius: 20px; padding: 16px; }
    .panel-head { display:flex; justify-content:space-between; gap: 12px; align-items:end; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 18px; }
    .panel-head span { color: #94a3b8; font-size: 14px; }
    .road-scroll { overflow-x: auto; padding-bottom: 8px; }
    .road { display: flex; gap: 10px; min-width: max-content; align-items: flex-start; min-height: 86px; }
    .empty { color: #64748b; min-height: 86px; display: grid; place-items: center; text-align:center; width:100%; }
    .round { width: 58px; flex: 0 0 58px; text-align:center; }
    .round-num { color:#94a3b8; font-size: 12px; margin-bottom: 6px; }
    .ball { width: 52px; height: 52px; margin: 0 auto; border-radius: 50%; display:grid; place-items:center; font-weight:900; font-size: 18px; border: 2px solid rgba(255,255,255,.18); }
    .ball.P { background:#2563eb; }
    .ball.B { background:#dc2626; }
    .ball.T { background:#16a34a; }
    .bottom { display:flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .secondary { flex:1; min-height: 52px; background:#1e293b; }
    .danger { flex:1; min-height: 52px; background:#7f1d1d; }
    .note { color:#64748b; font-size:12px; text-align:center; margin-top:16px; }
    @media (max-width: 580px) {
      .wrap { width: min(100% - 16px, 1100px); padding-top: 18px; }
      .controls { gap: 8px; }
      button { min-height: 64px; border-radius: 14px; }
      .stats { gap: 6px; }
      .stat { padding: 10px 5px; }
      .stat strong { font-size: 20px; }
      .panel-head { align-items:start; flex-direction:column; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>바카라 라운드 기록판 🃏</h1>
    <div class="sub">돈 없이 즐기는 오프라인 게임용 결과 기록판</div>

    <section class="controls" aria-label="라운드 결과 입력">
      <button class="player" data-result="P">PLAYER</button>
      <button class="banker" data-result="B">BANKER</button>
      <button class="tie" data-result="T">TIE</button>
    </section>

    <section class="stats">
      <div class="stat"><small>ROUND</small><strong id="roundCount">0</strong></div>
      <div class="stat"><small>PLAYER</small><strong id="playerCount">0</strong></div>
      <div class="stat"><small>BANKER</small><strong id="bankerCount">0</strong></div>
      <div class="stat"><small>TIE</small><strong id="tieCount">0</strong></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>라운드 기록</h2>
          <span>왼쪽 → 오른쪽 순서</span>
        </div>
        <span id="lastResult">아직 기록 없음</span>
      </div>

      <div class="road-scroll" id="roadScroll">
        <div class="road" id="road">
          <div class="empty" id="empty">PLAYER / BANKER / TIE 버튼을 눌러 시작하세요.</div>
        </div>
      </div>

      <div class="bottom">
        <button class="secondary" id="undo">↩ 마지막 기록 취소</button>
        <button class="danger" id="reset">전체 초기화</button>
      </div>
    </section>

    <div class="note">친선 게임 결과 기록용 · 베팅 및 금전 기능 없음</div>
  </main>

  <script>
    const history = [];
    const road = document.getElementById('road');
    const roadScroll = document.getElementById('roadScroll');
    const roundCount = document.getElementById('roundCount');
    const playerCount = document.getElementById('playerCount');
    const bankerCount = document.getElementById('bankerCount');
    const tieCount = document.getElementById('tieCount');
    const lastResult = document.getElementById('lastResult');

    const names = { P: 'PLAYER', B: 'BANKER', T: 'TIE' };

    function render() {
      const counts = { P: 0, B: 0, T: 0 };
      history.forEach(v => counts[v]++);
      roundCount.textContent = history.length;
      playerCount.textContent = counts.P;
      bankerCount.textContent = counts.B;
      tieCount.textContent = counts.T;
      road.innerHTML = '';

      if (!history.length) {
        road.innerHTML = '<div class="empty" id="empty">PLAYER / BANKER / TIE 버튼을 눌러 시작하세요.</div>';
        lastResult.textContent = '아직 기록 없음';
        return;
      }

      history.forEach((value, index) => {
        const item = document.createElement('div');
        item.className = 'round';
        item.innerHTML = `<div class="round-num">${index + 1}R</div><div class="ball ${value}">${value}</div>`;
        road.appendChild(item);
      });
      lastResult.textContent = `${history.length}R · ${names[history.at(-1)]}`;
    }

    document.querySelectorAll('[data-result]').forEach(btn => {
      btn.addEventListener('click', () => {
        history.push(btn.dataset.result);
        render();
        roadScroll.scrollLeft = roadScroll.scrollWidth;
      });
    });

    document.getElementById('undo').addEventListener('click', () => {
      if (!history.length) return;
      history.pop();
      render();
    });

    document.getElementById('reset').addEventListener('click', () => {
      if (!history.length) return;
      if (confirm('모든 라운드 기록을 초기화할까요?')) {
        history.length = 0;
        render();
      }
    });
  </script>
</body>
</html>
